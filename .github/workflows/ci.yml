name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Dummy values for build (not used at runtime)
          GOOGLE_SHEETS_ID: dummy
          GOOGLE_SERVICE_ACCOUNT_EMAIL: dummy@dummy.iam.gserviceaccount.com
          GOOGLE_PRIVATE_KEY: dummy
